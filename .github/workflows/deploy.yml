name: deploy

# Deploys to Cloud Run with Workload Identity Federation (no service account keys in GitHub).
# Repository variables: GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA
# Set DEPLOY_ON_PUSH=true to deploy every push to main after CI passes.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ON_PUSH == 'true')
    runs-on: ubuntu-latest
    environment: production
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/coach/conversation-coach-agent:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          gcloud builds submit --config deploy/cloudbuild.yaml \
            --substitutions "_REGION=${REGION},_REPO=coach,_TAG=${GITHUB_SHA}" .
      - name: Deploy new revision without traffic
        # Env vars, secrets and scaling come from the existing service (first deploy: deploy/deploy.sh).
        run: |
          gcloud run deploy conversation-coach-agent --image "$IMAGE" --region "$REGION" \
            --no-traffic --tag "sha-${GITHUB_SHA::7}"
      - name: Find the tagged revision URL
        id: tagged
        run: |
          export TAG="sha-${GITHUB_SHA::7}"
          url=$(gcloud run services describe conversation-coach-agent --region "$REGION" --format json |
            python3 -c 'import json,os,sys; t=json.load(sys.stdin)["status"]["traffic"]; print(next(x["url"] for x in t if x.get("tag")==os.environ["TAG"]))')
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Identity token for the private service
        id: idtoken
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.tagged.outputs.url }}
          id_token_include_email: true
      - name: Smoke test the tagged revision
        run: |
          curl -sf -H "Authorization: Bearer ${{ steps.idtoken.outputs.id_token }}" "${{ steps.tagged.outputs.url }}/healthz"
          curl -sf -H "Authorization: Bearer ${{ steps.idtoken.outputs.id_token }}" "${{ steps.tagged.outputs.url }}/readyz"
      - name: Shift traffic to the new revision
        run: |
          gcloud run services update-traffic conversation-coach-agent --region "$REGION" \
            --to-tags "sha-${GITHUB_SHA::7}=100"
