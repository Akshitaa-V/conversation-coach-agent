[project]
name = "conversation-coach-agent"
version = "0.1.0"
description = "Real-time roleplay and feedback agents for sales and service training, with evals, A/B analysis and Cloud Run deployment."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Akshitaa Vijayakumar" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "prometheus-client>=0.20",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
live = ["litellm>=1.40"]
otel = [
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp-proto-http>=1.24",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "websockets>=12",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coach*", "evals*", "experiments*", "loadtest*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
